[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "archivekit"
version = "27.0.0"
edition = "2021"
authors = ["arlomu"]
description = "ArchiveKit – ZIP, GZIP, TAR and .app containers for TontooOS. Hand-written codecs, zero dependencies except FishFile for app manifests."
license = "TCL"
repository = "https://github.com/TontooOS/ArchiveKit"
keywords = ["tontoo", "archive", "zip", "gzip", "tar", "compression", "app"]
categories = ["compression", "encoding"]
readme = "README.md"

[dependencies]
# App manifests (.fico) via FishFile; the codecs stay dependency-free.
fishfile = { version = "27.0", path = "../FishFile" }

[dev-dependencies]
# Benchmark-only competitors (never used by the library itself).
flate2 = "1"
zip = "2"
tar = "0.4"
